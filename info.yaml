# Tiny Tapeout project information
project:
  title: "TCPU-8"
  author: "Amishi"
  discord: "potututu"
  description: "8-bit single-cycle accumulator CPU with 3-bit PC and 8x8 program memory"
  language: "Verilog"
  clock_hz: 50000000

  tiles: "1x1"

  top_module: "tt_um_example"

  source_files:
    - "tcpu_wrapper.v"
    - "toy_cpu.v"
    - "program_loader.v"
    - "program_memory.v"
    - "decoding_unit.v"
    - "alu.v"
    - "execution_unit.v"
    - "program_counter.v"

pinout:
  ui[0]: "prog_data[0]"
  ui[1]: "prog_data[1]"
  ui[2]: "prog_data[2]"
  ui[3]: "prog_data[3]"
  ui[4]: "prog_data[4]"
  ui[5]: "prog_data[5]"
  ui[6]: "prog_data[6]"
  ui[7]: "prog_data[7]"

  uo[0]: "out_data[0]"
  uo[1]: "out_data[1]"
  uo[2]: "out_data[2]"
  uo[3]: "out_data[3]"
  uo[4]: "out_data[4]"
  uo[5]: "out_data[5]"
  uo[6]: "out_data[6]"
  uo[7]: "out_data[7]"

  uio[0]: "prog_load"
  uio[1]: "run"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6